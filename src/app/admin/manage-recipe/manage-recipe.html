<div>
   <div class="row gx-0">
       <div class="col-lg-2">
          <app-admin-sidebar></app-admin-sidebar>
       </div>
       <div class="container-fluid col d-flex flex-column justify-content-center align-items-center">
          @if(recipeId){
            <h1 class="my-5">Edit Recipe Details</h1>
          }@else {
            <h1 class="my-5">Add Recipe Details</h1>
          }
          <!-- {{recipeDetails()|json}} -->
          <div style="width: 900px;" class="border p-5 rounded my-5">
             <div class="row">
               <div class="col-lg-6">
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().name" type="text" placeholder="Recipe Name" class="form-control">
                 </div>
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().cuisine" type="text" placeholder="Recipe Cuisine" class="form-control">
                 </div>
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().image" type="text" placeholder="Recipe Image URL" class="form-control">
                 </div>
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().prepTimeMinutes" type="text" placeholder="Recipe Preparation Time in Minutes" class="form-control">
                 </div>
                 <div class="mb-2">
                    <!-- add ingredient -->
                    <div class="d-flex mb-2">
                        <textarea #ingredientInput placeholder="Add Ingredients" class="form-control"></textarea>
                        <button (click)="addIngredient(ingredientInput)" class="btn fw-bolder fs-1 ms-1">+</button>
                    </div>
                    <!-- ingredients list display -->
                    @for(item of ingredientArray; track $index) {
                        <div class="d-flex mb-2">
                        <input [value]="item" readonly type="text" placeholder="Ingredient" class="form-control">
                        <button (click)="removeIngredient(item)" class="btn ms-1"><i class="fa-solid fa-trash text-danger"></i></button>
                    </div>
                     }
                 </div>
               </div>
               <div class="col-lg-6">
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().servings" type="text" placeholder="Servings (eg:4)" class="form-control">
                 </div>
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().caloriesPerServing" type="text" placeholder="Calorie per Servings (eg:350)" class="form-control">
                 </div>
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().cookTimeMinutes" type="text" placeholder="Recipe Cook Time in Minutes" class="form-control">
                 </div>
                 <div class="mb-2">
                    <input [(ngModel)]="recipeDetails().difficulty" type="text" placeholder="Mode of Cooking (eg: Hard / Medium / Easy)" class="form-control">
                 </div>
                 <div class="mb-2">
                    <!-- add instructions -->
                    <div class="d-flex mb-2">
                        <textarea #instructionInput placeholder="Add Instructions" class="form-control"></textarea>
                        <button (click)="addInstruction(instructionInput)" class="btn fw-bolder fs-1 ms-1">+</button>
                    </div>
                    <!-- instructions list display -->
                    @for(item of instructionArray; track $index) {
                      <div class="d-flex mb-2">
                        <input [value]="item" readonly type="text" placeholder="Instruction" class="form-control">
                        <button (click)="removeInstruction(item)" class="btn ms-1"><i class="fa-solid fa-trash text-danger"></i></button>
                      </div>
                     }
                 </div>
               </div>
             </div>
             <!-- add mealtype -->
             <div class="d-flex mb-2">
                <textarea #mealInput placeholder="Add Meal Type (eg: Breakfast, Lunch, Dinner etc...)" class="form-control"></textarea>
                <button (click)="addMeal(mealInput)" class="btn fw-bolder fs-1 ms-1">+</button>
            </div>
            <!-- mealtype list display -->
             <div class="d-flex flex-wrap">
                @for(item of mealTypeArray; track $index){
                 <span class="border rounded ps-2 me-1">
                    {{item}}
                    <button (click)="removeMeal(item)" class="btn fw-bolder"><i class="fa-solid fa-x text-danger"></i></button>
                 </span>
                }
            </div>
            <div class="text-center mt-3">
                @if(recipeId){
                  <button (click)="updateRecipe()" class="btn btn-warning">UPDATE RECIPE</button>
                }@else{
                  <button (click)="addRecipe()" class="btn btn-success">ADD RECIPE</button>
                }
            </div>
          </div>
       </div>
   </div>
</div>
