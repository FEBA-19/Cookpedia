<div style="background-image: url('https://static.vecteezy.com/system/resources/thumbnails/033/027/755/small_2x/flat-lay-vegetables-on-white-background-food-and-diet-concept-ai-generated-free-photo.jpg'); width: 100vw; height: 90vh; background-position: left center; background-size: cover;" class="container">
    <div class="d-flex flex-column justify-content-center align-items-center py-5 w-100">
        <h2>Login</h2>
        <p>More than 100 plus Recipes from around the world</p>
        <!-- login form -->
        <form [formGroup]="loginForm" (ngSubmit)="submitLoginForm()" style="width: 400px; background-color: rgba(0, 0, 0, 0.1)" class="shadow rounded my-5 py-5 d-flex flex-column justify-content-center align-items-center">
           <h3><i class="fa-solid fa-graduation-cap"></i> Cookpedia</h3>
           <input name="email" formControlName="email" class="my-3 form-control w-75" type="email" placeholder="Email">
           @if (loginForm.get('email')?.errors && loginForm.get('email')?.touched){
                <p class="mb-3 text-danger">*Invalid Email</p>
               }
           <input name="password" formControlName="password" class="mt-2 mb-4 form-control w-75" type="password" placeholder="Password">
           @if (loginForm.get('password')?.errors && loginForm.get('password')?.touched){
                <p class="mb-3 text-danger">*Invalid Password</p>
               }
           <button class="btn btn-success w-75">Login</button>
        </form>
    </div>
</div>
<app-footer></app-footer>
